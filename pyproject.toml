[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brewq"
version = "0.2.0"
description = "Rich Homebrew search with cached analytics and readable terminal output"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ivan Cherniukh" }]
dependencies = []

[project.scripts]
brewq = "brewq.cli:main"
bq = "brewq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brewq = ["data/*.json.gz"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
