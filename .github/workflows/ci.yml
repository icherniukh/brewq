name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh for the completion contract
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: BREWQ_REQUIRE_ZSH=1 uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv build --wheel
      - run: uvx twine check dist/*
      - name: Install the built wheel in isolation and smoke-test it
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --offline dist/*.whl
          /tmp/wheelcheck/bin/brewq --version
          BREWQ_NO_AUTO_REFRESH=1 /tmp/wheelcheck/bin/brewq --tsv -c name ripgrep
