name: completion

on:
  push:
  pull_request:

jobs:
  printed-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Printed completion must be the current valid zsh script
        run: BREWQ_REQUIRE_ZSH=1 uv run pytest -q tests/test_completion.py
