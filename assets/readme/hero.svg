<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">brewq — Homebrew query CLI showing ranked grep results</title>
  <desc id="desc">Split terminal hero showing brewq identity on the left and a ranked brewq -t 4 grep output table on the right with 90-day install counts, trend cues, installed checkmarks, and descriptions.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="20" fill="#181825"/>

  <g id="identity">
    <text x="48" y="72" class="mono" font-size="18" font-weight="600" letter-spacing="1.4" fill="#89dceb">HOMEBREW QUERY CLI</text>
    <text x="48" y="144" class="sans" font-size="68" font-weight="700" fill="#cdd6f4">brewq</text>
    <rect x="262" y="98" width="12" height="46" rx="2" fill="#89dceb"/>

    <text x="48" y="194" class="sans" font-size="22" fill="#bac2de">Search formulae and casks by</text>
    <text x="48" y="224" class="sans" font-size="22" fill="#bac2de">name, alias, or description.</text>
    <text x="48" y="258" class="sans" font-size="20" fill="#a6adc8">Ranked by 90d installs. Read-only.</text>

    <line x1="48" y1="292" x2="412" y2="292" stroke="#313244" stroke-width="1.5"/>
    <text x="48" y="326" class="mono" font-size="18" fill="#7f849c">local cache · trend cues · TSV</text>
  </g>

  <g id="terminal-specimen">
    <rect x="448" y="32" width="708" height="316" rx="14" fill="#1e1e2e" stroke="#313244" stroke-width="1.5"/>
    <line x1="448" y1="80" x2="1156" y2="80" stroke="#313244" stroke-width="1.5"/>

    <text x="472" y="63" class="mono" font-size="20">
      <tspan fill="#89b4fa" font-weight="700">$</tspan><tspan dx="10" fill="#a6e3a1" font-weight="700">brewq</tspan><tspan dx="10" fill="#89dceb">-t</tspan><tspan dx="10" fill="#fab387">4</tspan><tspan dx="10" fill="#cdd6f4">grep</tspan>
    </text>
    <text x="1132" y="62" class="mono" font-size="16" text-anchor="end" fill="#6c7086">example snapshot</text>

    <text x="472" y="114" class="mono" font-size="18" font-weight="700" fill="#a6adc8">NAME</text>
    <text x="702" y="114" class="mono" font-size="18" font-weight="700" text-anchor="end" fill="#cdd6f4">90d ↓</text>
    <text x="816" y="114" class="mono" font-size="18" font-weight="700" text-anchor="end" fill="#a6adc8">TREND</text>
    <text x="842" y="114" class="mono" font-size="18" font-weight="700" fill="#a6adc8">DESC</text>
    <line x1="472" y1="128" x2="1132" y2="128" stroke="#313244" stroke-width="1.5"/>

    <g id="row-1">
      <text x="472" y="164" class="mono" font-size="20" fill="#89dceb">grep</text>
      <text x="702" y="164" class="mono" font-size="20" text-anchor="end" fill="#cdd6f4">6,100</text>
      <text x="816" y="164" class="mono" font-size="20" text-anchor="end" fill="#7f849c">0.7x ↓</text>
      <text x="842" y="164" class="mono" font-size="20" fill="#bac2de">GNU grep, egrep and…</text>
    </g>

    <g id="row-2">
      <text x="472" y="202" class="mono" font-size="20">
        <tspan fill="#89dceb">ripgrep</tspan><tspan dx="8" fill="#a6e3a1">✔</tspan>
      </text>
      <text x="702" y="202" class="mono" font-size="20" text-anchor="end" fill="#cdd6f4">97,845</text>
      <text x="816" y="202" class="mono" font-size="20" text-anchor="end" fill="#7f849c">0.7x ↓</text>
      <text x="842" y="202" class="mono" font-size="20" fill="#bac2de">Search tool like grep…</text>
    </g>

    <g id="row-3">
      <text x="472" y="240" class="mono" font-size="20">
        <tspan fill="#89dceb">ast-grep</tspan><tspan dx="8" fill="#a6e3a1">✔</tspan>
      </text>
      <text x="702" y="240" class="mono" font-size="20" text-anchor="end" fill="#cdd6f4">32,016</text>
      <text x="816" y="240" class="mono" font-size="20" font-weight="700" text-anchor="end" fill="#a6e3a1">1.5x ↑</text>
      <text x="842" y="240" class="mono" font-size="20" fill="#bac2de">Code searching, lint…</text>
    </g>

    <g id="row-4">
      <text x="472" y="278" class="mono" font-size="20" fill="#89dceb">semgrep</text>
      <text x="702" y="278" class="mono" font-size="20" text-anchor="end" fill="#cdd6f4">19,788</text>
      <text x="816" y="278" class="mono" font-size="20" text-anchor="end" fill="#7f849c">1.1x ·</text>
      <text x="842" y="278" class="mono" font-size="20" fill="#bac2de">Easily detect and…</text>
    </g>

    <text x="472" y="324" class="mono" font-size="18" fill="#6c7086">showing 4 of 36 · cache: 5h old</text>
  </g>
</svg>
