<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">brewq — Homebrew query CLI showing ranked grep results</title>
  <desc id="desc">Split terminal hero showing brewq identity on the left and a ranked brewq -t 4 grep output table on the right with 90-day install counts, trend cues, installed checkmarks, and descriptions.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="20" fill="#1F2430"/>

  <g id="identity">
    <text x="48" y="72" class="mono" font-size="18" font-weight="600" letter-spacing="1.4" fill="#7FB4CA">HOMEBREW QUERY CLI</text>
    <text x="48" y="144" class="sans" font-size="68" font-weight="700" fill="#DCD7BA">brewq</text>
    <rect x="262" y="98" width="12" height="46" rx="2" fill="#7FB4CA"/>

    <text x="48" y="194" class="sans" font-size="22" fill="#C8C093">Search formulae and casks by</text>
    <text x="48" y="224" class="sans" font-size="22" fill="#C8C093">name, alias, or description.</text>
    <text x="48" y="258" class="sans" font-size="20" fill="#9E9E9E">Ranked by 90d installs. Read-only.</text>

    <line x1="48" y1="292" x2="412" y2="292" stroke="#2A2A37" stroke-width="1.5"/>
    <text x="48" y="326" class="mono" font-size="18" fill="#727169">local cache · trend cues · TSV</text>
  </g>

  <g id="terminal-specimen">
    <rect x="448" y="32" width="708" height="316" rx="14" fill="#16161E" stroke="#2A2A37" stroke-width="1.5"/>
    <line x1="448" y1="80" x2="1156" y2="80" stroke="#2A2A37" stroke-width="1.5"/>

    <text x="472" y="63" class="mono" font-size="20">
      <tspan fill="#7E9CD8" font-weight="700">$</tspan><tspan dx="10" fill="#98BB6C" font-weight="700">brewq</tspan><tspan dx="10" fill="#7FB4CA">-t</tspan><tspan dx="10" fill="#FFA066">4</tspan><tspan dx="10" fill="#DCD7BA">grep</tspan>
    </text>
    <text x="1132" y="62" class="mono" font-size="16" text-anchor="end" fill="#727169">example snapshot</text>

    <text x="472" y="114" class="mono" font-size="18" font-weight="700" fill="#9E9E9E">NAME</text>
    <text x="702" y="114" class="mono" font-size="18" font-weight="700" text-anchor="end" fill="#DCD7BA">90d ↓</text>
    <text x="816" y="114" class="mono" font-size="18" font-weight="700" text-anchor="end" fill="#9E9E9E">TREND</text>
    <text x="842" y="114" class="mono" font-size="18" font-weight="700" fill="#9E9E9E">DESC</text>
    <line x1="472" y1="128" x2="1132" y2="128" stroke="#2A2A37" stroke-width="1.5"/>

    <g id="row-1">
      <text x="472" y="164" class="mono" font-size="20" fill="#7E9CD8">grep</text>
      <text x="702" y="164" class="mono" font-size="20" text-anchor="end" fill="#DCD7BA">6,100</text>
      <text x="816" y="164" class="mono" font-size="20" text-anchor="end" fill="#727169">0.7x ↓</text>
      <text x="842" y="164" class="mono" font-size="20" fill="#C8C093">GNU grep, egrep and…</text>
    </g>

    <g id="row-2">
      <text x="472" y="202" class="mono" font-size="20">
        <tspan fill="#7E9CD8">ripgrep</tspan><tspan dx="8" fill="#98BB6C">✔</tspan>
      </text>
      <text x="702" y="202" class="mono" font-size="20" text-anchor="end" fill="#DCD7BA">97,845</text>
      <text x="816" y="202" class="mono" font-size="20" text-anchor="end" fill="#727169">0.7x ↓</text>
      <text x="842" y="202" class="mono" font-size="20" fill="#C8C093">Search tool like grep…</text>
    </g>

    <g id="row-3">
      <text x="472" y="240" class="mono" font-size="20">
        <tspan fill="#7E9CD8">ast-grep</tspan><tspan dx="8" fill="#98BB6C">✔</tspan>
      </text>
      <text x="702" y="240" class="mono" font-size="20" text-anchor="end" fill="#DCD7BA">32,016</text>
      <text x="816" y="240" class="mono" font-size="20" font-weight="700" text-anchor="end" fill="#98BB6C">1.5x ↑</text>
      <text x="842" y="240" class="mono" font-size="20" fill="#C8C093">Code searching, lint…</text>
    </g>

    <g id="row-4">
      <text x="472" y="278" class="mono" font-size="20" fill="#7E9CD8">semgrep</text>
      <text x="702" y="278" class="mono" font-size="20" text-anchor="end" fill="#DCD7BA">19,788</text>
      <text x="816" y="278" class="mono" font-size="20" text-anchor="end" fill="#727169">1.1x ·</text>
      <text x="842" y="278" class="mono" font-size="20" fill="#C8C093">Easily detect and…</text>
    </g>

    <text x="472" y="324" class="mono" font-size="18" fill="#727169">showing 4 of 36 · cache: 5h old</text>
  </g>
</svg>
