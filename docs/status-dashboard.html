<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>brewq Project Status</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --panel-2: #20232a;
      --text: #eef0f4;
      --muted: #a7adba;
      --line: #30343d;
      --good: #87d7af;
      --work: #d7afff;
      --ready: #87afff;
      --risk: #ffaf5f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 3vw, 36px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    h2 {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      text-transform: none;
    }

    h3 {
      font-size: 15px;
      margin-bottom: 3px;
    }

    code,
    .mono {
      color: var(--ready);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .subhead {
      color: var(--muted);
      font-size: 16px;
      margin-top: 12px;
      max-width: 680px;
    }

    .snapshot {
      color: var(--muted);
      justify-self: end;
      text-align: right;
    }

    .snapshot strong {
      color: var(--text);
      display: block;
      font-size: 16px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.metrics {
      grid-template-columns: repeat(4, minmax(220px, 1fr));
      margin-bottom: 16px;
    }

    .grid.two {
      grid-template-columns: 1fr 1fr;
      margin-bottom: 16px;
    }

    .grid.work-board {
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.75fr);
    }

    .grid.lower-board {
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      margin-bottom: 16px;
    }

    .side-rail {
      display: grid;
      gap: 16px;
    }

    .grid.three {
      grid-template-columns: 1fr 1fr 1fr;
      margin-bottom: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      padding: 18px;
    }

    .panel.compact {
      padding: 16px;
    }

    .metric {
      align-items: center;
      display: grid;
      gap: 14px;
      grid-template-columns: auto minmax(0, 1fr);
      min-height: 104px;
    }

    .metric .value {
      font-size: 40px;
      font-weight: 750;
      line-height: 1;
    }

    .metric p {
      max-width: 34rem;
    }

    .metric .label,
    .muted {
      color: var(--muted);
    }

    .metric.good .value {
      color: var(--good);
    }

    .metric.work .value {
      color: var(--work);
    }

    .metric.ready .value {
      color: var(--ready);
    }

    .metric.risk .value {
      color: var(--risk);
    }

    .donut-wrap {
      align-items: center;
      display: grid;
      gap: 18px;
      grid-template-columns: 138px 1fr;
      grid-column: 1 / -1;
      min-height: 180px;
    }

    .donut {
      align-items: center;
      aspect-ratio: 1;
      background: conic-gradient(var(--good) 0 var(--closed-end), var(--work) var(--closed-end) var(--active-end), var(--ready) var(--active-end) 100%);
      border-radius: 50%;
      display: grid;
      justify-items: center;
      width: 138px;
    }

    .donut-value {
      align-items: center;
      aspect-ratio: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text);
      display: grid;
      font-size: 27px;
      font-weight: 750;
      justify-items: center;
      width: 92px;
    }

    .legend {
      color: var(--muted);
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .legend span {
      align-items: center;
      display: inline-grid;
      gap: 8px;
      grid-template-columns: 12px 1fr;
    }

    .swatch {
      border-radius: 3px;
      display: inline-block;
      height: 12px;
      width: 12px;
    }

    .swatch.good {
      background: var(--good);
    }

    .swatch.work {
      background: var(--work);
    }

    .swatch.ready {
      background: var(--ready);
    }

    .bar-list,
    .issue-list,
    .commit-list,
    .signal-list {
      display: grid;
      gap: 10px;
    }

    .bar-row {
      align-items: center;
      display: grid;
      gap: 12px;
      grid-template-columns: 142px 1fr 32px;
    }

    .bar-row .name {
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-row .track {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 99px;
      height: 13px;
      overflow: hidden;
    }

    .bar-row .fill {
      background: linear-gradient(90deg, var(--ready), var(--work));
      border-radius: inherit;
      height: 100%;
    }

    .bar-row .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .issue,
    .commit,
    .signal {
      border-bottom: 1px solid var(--line);
      padding: 10px 0 11px;
    }

    .issue {
      align-items: start;
      display: grid;
      gap: 12px;
      grid-template-columns: 86px minmax(0, 1fr);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      grid-column: 2;
      justify-content: flex-start;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--muted);
      font-size: 12px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .commit {
      display: grid;
      gap: 12px;
      grid-template-columns: 72px 1fr;
    }

    .commit .sha {
      color: var(--good);
    }

    .signal strong {
      display: block;
      margin-bottom: 3px;
    }

    .signal.good {
      border-bottom-color: rgba(135, 215, 175, 0.42);
    }

    .signal.warn {
      border-bottom-color: rgba(255, 175, 95, 0.46);
    }

    .note-list {
      display: grid;
      gap: 0;
    }

    .note {
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 12px;
      grid-template-columns: 170px minmax(0, 1fr);
      padding: 11px 0;
    }

    footer {
      color: var(--muted);
      font-size: 12px;
      margin-top: 18px;
      text-align: right;
    }

    @media (max-width: 900px) {
      header,
      .grid.metrics,
      .grid.two,
      .grid.three,
      .grid.work-board,
      .grid.lower-board {
        grid-template-columns: 1fr;
      }

      .snapshot {
        justify-self: start;
        text-align: left;
      }

      .donut-wrap,
      .issue,
      .note {
        grid-template-columns: 1fr;
      }

      .tags {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>brewq status</h1>
        <p class="subhead" data-field="summaryText">Loading project status...</p>
      </div>
      <div class="snapshot" id="snapshot"></div>
    </header>

    <section class="grid metrics" aria-label="Project metrics">
      <article class="panel metric ready" id="metric-ready"></article>
      <article class="panel metric work" id="metric-active"></article>
      <article class="panel metric warn" id="metric-tests"></article>
      <article class="panel metric risk" id="metric-blocked"></article>
    </section>

    <section class="grid work-board">
      <article class="panel">
        <h2>Next work</h2>
        <div class="issue-list" id="ready-work"></div>
      </article>

      <div class="side-rail">
        <article class="panel">
          <h2>Risks and freshness</h2>
          <div class="signal-list" id="signals"></div>
        </article>

        <article class="panel donut-wrap">
          <div class="donut" id="donut" aria-label="Project issue completion">
            <div class="donut-value" id="donut-value">0%</div>
          </div>
          <div>
            <h2>Tracker shape</h2>
            <p id="tracker-copy"></p>
            <div class="legend" id="legend" aria-label="Tracker legend"></div>
          </div>
        </article>
      </div>
    </section>

    <section class="grid lower-board">
      <article class="panel">
        <h2>Open lanes</h2>
        <div class="bar-list" id="workstreams"></div>
      </article>

      <article class="panel">
        <h2>Operating notes</h2>
        <div class="note-list" id="notes"></div>
      </article>
    </section>

    <section class="panel">
      <h2>Recent changes</h2>
      <div class="commit-list" id="commits"></div>
    </section>

    <footer id="footer"></footer>
  </main>

  <script>
    let data = JSON.parse(document.getElementById("dashboard-data").textContent);

    function text(value) {
      return value == null ? "" : String(value);
    }

    function htmlEscape(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function pct(part, total) {
      if (!total) return 0;
      return Math.round((part / total) * 100);
    }

    function setMetric(id, value, label, detail) {
      document.getElementById(id).innerHTML = `
        <div>
          <div class="value">${htmlEscape(value)}</div>
          <div class="label">${htmlEscape(label)}</div>
        </div>
        <p class="muted">${detail}</p>
      `;
    }

    function tags(labels) {
      return (labels || []).map((label) => `<span class="tag">${htmlEscape(label)}</span>`).join("");
    }

    async function loadLiveData() {
      if (window.location.protocol === "file:") {
        return;
      }
      const response = await fetch(`status-dashboard-data.json?ts=${Date.now()}`, {
        cache: "no-store",
      });
      if (response.ok) {
        data = await response.json();
      }
    }

    function render() {
      const stats = data.stats || {};
      const total = stats.total_issues || 0;
      const closed = stats.closed_issues || 0;
      const active = stats.in_progress_issues || 0;
      const ready = stats.ready_issues || 0;
      const blocked = stats.blocked_issues || 0;
      const closedPct = pct(closed, total);
      const activePct = pct(closed + active, total);

      document.querySelector("[data-field='summaryText']").textContent = data.summary_text || "";
      document.getElementById("snapshot").innerHTML = `
        <strong>Snapshot: ${htmlEscape(data.generated_at)}</strong>
        Source: local beads tracker and git history<br>
        Active: ${htmlEscape((data.active || []).map((issue) => issue.id).join(", ") || "none")}
      `;

      document.getElementById("donut").style.setProperty("--closed-end", `${closedPct}%`);
      document.getElementById("donut").style.setProperty("--active-end", `${activePct}%`);
      document.getElementById("donut-value").textContent = `${closedPct}%`;
      document.getElementById("tracker-copy").innerHTML = `<strong>${closed} of ${total}</strong> tracked issues are closed. ${active} active, ${ready} ready, ${blocked} blocked.`;
      document.getElementById("legend").innerHTML = `
        <span><i class="swatch good"></i>Closed: ${closed}</span>
        <span><i class="swatch work"></i>In progress: ${active}</span>
        <span><i class="swatch ready"></i>Ready: ${ready}</span>
      `;

      setMetric("metric-ready", ready, "ready issues", blocked ? "Some work is blocked." : "No blockers in the current tracker view.");
      setMetric("metric-active", active, "in progress", htmlEscape((data.active || []).map((issue) => issue.title).join(", ") || "No active tracker items."));
      setMetric("metric-tests", "Not run", "verification", htmlEscape(data.tests?.command || "Not recorded"));
      setMetric("metric-blocked", blocked, "blocked", "Dependencies determine which work can start.");

      const maxWorkstream = Math.max(1, ...(data.workstreams || []).map((item) => item.count));
      document.getElementById("workstreams").innerHTML = (data.workstreams || []).map((item) => `
        <div class="bar-row">
          <div class="name">${htmlEscape(item.name)}</div>
          <div class="track"><div class="fill" style="width: ${pct(item.count, maxWorkstream)}%"></div></div>
          <div class="count">${htmlEscape(item.count)}</div>
        </div>
      `).join("");

      document.getElementById("signals").innerHTML = (data.signals || []).map((signal) => `
        <div class="signal ${htmlEscape(signal.kind || "good")}">
          <strong>${htmlEscape(signal.title)}</strong>
          <span class="muted">${htmlEscape(signal.body)}</span>
        </div>
      `).join("");

      document.getElementById("ready-work").innerHTML = (data.ready || []).map((issue) => `
        <div class="issue">
          <div class="mono">${htmlEscape(issue.id)}</div>
          <div><h3>${htmlEscape(issue.title)}</h3><p class="muted">${htmlEscape(issue.summary)}</p></div>
          <div class="tags">${tags(issue.labels)}</div>
        </div>
      `).join("");

      document.getElementById("commits").innerHTML = (data.commits || []).map((commit) => `
        <div class="commit">
          <div class="sha mono">${htmlEscape(commit.sha)}</div>
          <div>${htmlEscape(commit.subject)}</div>
        </div>
      `).join("");

      document.getElementById("notes").innerHTML = (data.notes || []).map((note) => `
        <div class="note">
          <h3>${htmlEscape(note.title)}</h3>
          <p class="muted">${htmlEscape(note.body)}</p>
        </div>
      `).join("");

      document.getElementById("footer").innerHTML = `Live mode: <code>python3 scripts/serve-status-dashboard.py</code>. Static refresh: <code>python3 scripts/update-status-dashboard.py</code>.`;
    }

    loadLiveData()
      .catch(() => {})
      .finally(render);
  </script>
